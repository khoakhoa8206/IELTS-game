  --ink:#1d1a2f;--cream:#fff1bf;--paper:#fff8e8;--grass:#6fd05a;--yel:#ffd23f;--red:#ef4b4b;--green:#2fb344;
  --px:'Press Start 2P','VT323','Courier New',monospace;--vt:'VT323','Courier New',monospace;--read:'Nunito',system-ui,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--vt);font-size:24px;line-height:1.1;color:var(--ink);background:var(--grass);background-image:var(--grass-tile,none);background-size:64px 64px;image-rendering:pixelated;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.spr{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.px{font-family:var(--px);font-weight:400}
:focus-visible{outline:4px solid #1e6fe0;outline-offset:3px}

/* ---------- khung pixel dùng chung ---------- */
.btn,.panel,.chip,.dlg,.pane,.q-card,.skill-card,.node,.goal-box,.who,.step,.rec-btn,.start-sign,.toast,.qrow,.t-card,.data-box,.road-chip{
  box-shadow:0 -4px 0 0 var(--bd,var(--ink)),0 4px 0 0 var(--bd,var(--ink)),-4px 0 0 0 var(--bd,var(--ink)),4px 0 0 0 var(--bd,var(--ink)),inset 0 -6px 0 0 rgba(0,0,0,.12);
}
.panel{background:var(--cream);margin:4px;padding:16px}
.chip{display:inline-block;background:var(--cream);padding:3px 10px;margin:6px;font-size:21px;line-height:1.1}
.chip b{font-weight:400;color:#c2410c}
.chip.good{background:#c8f4c4}.chip.bad{background:#ffd0d0}.chip.alt{background:#d8c8ff}
.hint{font:600 15px/1.5 var(--read);color:#555;margin:6px 0}
.empty{font:600 17px/1.5 var(--read);color:#555;padding:14px;text-align:center}

/* ---------- nút ---------- */
.btn{font-family:var(--vt);font-size:24px;line-height:1;padding:10px 18px;color:var(--ink);background:var(--yel);border:0;cursor:pointer;margin:6px;transition:transform .06s;
  background-image:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0) 40%)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-green{background-color:#3fcf59}.btn-blue{background-color:#59b8ff}.btn-red{background-color:#ff7676}.btn-ghost{background-color:#fff}
.btn-sm{font-size:20px;padding:6px 12px}
.btn-lg{font-size:30px;padding:14px 28px}
.link-btn{background:none;border:0;color:#1e5fd4;text-decoration:underline;font:22px var(--vt);cursor:pointer;margin-top:10px;padding:4px}

/* ---------- nền các màn hình ---------- */
.screen{position:relative;min-height:100vh;overflow-x:hidden;overflow-x:clip;padding-bottom:20px} /* clip: không chặn phần tử dính (sticky) */
.sky-screen{background:linear-gradient(#37b4f0,#8fdcf8 65%,#c0eefc)}
.sky-screen::before{content:"";position:absolute;left:0;right:0;bottom:70px;height:190px;background:var(--skyline) repeat-x left bottom/auto 190px;image-rendering:pixelated;pointer-events:none}
.grass-screen{background:var(--grass);background-image:var(--grass-tile,none);background-size:64px 64px}
.dusk-screen{background:linear-gradient(#4a2fa8 0%,#7b3fc2 45%,#d86bc9 82%,#ff9fd2 100%)}
.dusk-screen::after{content:"";position:fixed;left:-25%;right:-25%;bottom:0;height:42vh;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,130,225,.75) 0 3px,transparent 3px 56px),repeating-linear-gradient(0deg,rgba(255,130,225,.75) 0 3px,transparent 3px 40px);
  transform:perspective(260px) rotateX(58deg);transform-origin:bottom center;opacity:.7}
.clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.clouds .spr{position:absolute;animation:drift linear infinite;opacity:.95}
.dusk-screen .clouds{position:fixed}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--ground) repeat-x left bottom/48px 72px;image-rendering:pixelated;z-index:1;pointer-events:none}
@keyframes bob{50%{transform:translateY(-4px)}}
.stand-l,.stand-r{position:absolute;bottom:60px;z-index:2;animation:bob 1s steps(2) infinite;pointer-events:none}
.stand-l{left:6%}.stand-r{right:6%}

/* ---------- HUD trang trí ---------- */
.hud-deco{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:16px;pointer-events:none;z-index:3}
.hrow{display:flex;gap:4px;margin-bottom:5px}
.spr.dim{opacity:.35;filter:grayscale(1)}
.hud-r .bar{margin-bottom:6px}
.bar{width:150px;height:16px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.bar i{display:block;height:100%}
.bar.g i{background:#56d364}.bar.p i{background:#ff6fb0}
.topbar{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 16px}
.topbar .hud-deco{position:static;display:flex;gap:16px;align-items:flex-start;flex:0 0 auto}
.who{display:flex;align-items:center;gap:10px;background:var(--cream);padding:6px 14px;font-size:28px;margin:4px;max-width:100%}
.who b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw}
.tb-actions{display:flex;flex-wrap:wrap;gap:4px}
.t-logo{font-size:clamp(14px,3vw,22px);line-height:1.4;color:var(--yel);margin:0;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 #e8542f}

/* ---------- đăng nhập ---------- */
.login{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;padding:64px 16px 150px}
.logo{margin:0;text-align:center;line-height:1.25;font-family:var(--px);font-weight:400;font-size:clamp(34px,10vw,72px);color:var(--yel);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 #e8542f;letter-spacing:2px}
.logo span{display:block}.logo span+span{color:#fff}
.tagline{font-size:30px;color:#fff;text-shadow:3px 3px 0 var(--ink);margin:6px 0 10px;text-align:center}
.dlg.static{position:relative;width:min(460px,100%);margin:10px auto}
.login-body{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.login-body .btn{margin:6px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--vt);font-size:23px;padding:8px 10px;background:#fff;border:3px solid var(--ink);cursor:pointer;flex:1;min-width:0;line-height:1.3}
.tab.on{background:var(--yel)}
.lbl{display:block;font:800 16px var(--read);margin-bottom:6px}
.inp,.ta,.sel{font:600 17px var(--read);padding:8px 10px;border:3px solid var(--ink);background:#fff;width:100%;border-radius:0}
.inp.big{font-size:22px;padding:12px}
.inp.narrow,.sel.narrow{width:150px}
.inp.narrow-dt{width:auto;min-width:240px}
.ta{resize:vertical;line-height:1.5}
.sel{width:auto;max-width:100%}

/* ---------- hộp thoại ---------- */
.dlg-wrap{position:fixed;inset:0;background:rgba(24,12,60,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.dlg{--bd:var(--ink);width:min(520px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--cream);margin:4px}
.dlg.big{width:min(620px,100%)}.dlg.wide{width:min(920px,100%)}
.dlg-bar{background:var(--ink);color:#fff;font-family:var(--vt);font-size:26px;letter-spacing:1px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;line-height:1.4}
.dlg-x{background:var(--cream);color:var(--ink);border:2px solid #fff;width:30px;height:30px;font:400 26px/1 var(--vt);cursor:pointer;padding:0}
.dlg-body{padding:18px;overflow:auto;font-size:24px}
.dlg-msg{font:600 18px/1.6 var(--read);margin:0 0 8px}
.dlg-foot{padding:6px 14px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{--bd:#fff;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;font-size:22px;z-index:300;max-width:92vw;text-align:center;line-height:1.2}
.toast.bad{background:#b52a2a}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:150}
.confetti i{position:absolute;top:-12px;width:10px;height:10px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg)}}
.congrats,.result{text-align:center}
.cg-trophy{animation:bob .8s steps(2) infinite}
.cg-t{font-family:var(--vt);font-weight:400;font-size:clamp(34px,7vw,46px);line-height:1;letter-spacing:1px;color:var(--yel);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 #e8542f;margin:16px 0 12px}
.cg-s{font:700 18px/1.6 var(--read);margin:6px 0}
.cg-all{font:800 18px/1.5 var(--read);color:#6b3fc7}
.res-score{font-family:var(--vt);font-size:clamp(56px,14vw,84px);line-height:1;margin:6px 0 10px;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;color:#7be06b;text-shadow:4px 4px 0 rgba(0,0,0,.25)}
.res-wrong{text-align:left;font:600 16px/1.7 var(--read);max-height:200px;overflow:auto;background:#fff;border:2px solid var(--ink);padding:8px 12px;margin-top:8px}
.res-wrong ul{margin:6px 0 0;padding-left:20px}
.x{color:#c62828}.ok{color:#1f8a31}

/* ---------- trang chủ học sinh ---------- */
.hub{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:6px 18px 150px;text-align:center}
.hub-title{font-family:var(--vt);font-weight:400;font-size:clamp(44px,9vw,72px);letter-spacing:3px;line-height:1;color:var(--yel);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 #e8542f;margin:10px 0 34px}
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:34px 28px}
.skill-card{position:relative;display:flex;gap:16px;align-items:center;text-align:left;padding:20px 18px 18px;margin:4px;background:#fff0ee;--bd:#c62828;border:0;cursor:pointer;font-family:var(--vt);transition:transform .08s}
.skill-card:hover{transform:translateY(-4px)}
.skill-card.green{--bd:#1f8a31;background:#eaffe6}.skill-card.gray{--bd:#6b7280;background:#efefef}
.sc-icon{flex:none;width:72px;height:72px;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 3px var(--ink)}
.sc-txt{min-width:0;flex:1}
.sc-name{font-size:17px;line-height:1.3;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.sc-vi{font-size:30px;margin:4px 0 8px}
.sc-bar{height:16px;background:#fff;border:3px solid var(--ink)}
.sc-bar i{display:block;height:100%;background:#3fcf59}
.sc-meta{font-size:20px;margin-top:6px;color:#333;line-height:1.15}
.sc-flag{position:absolute;top:-20px;right:14px;background:#c62828;color:#fff;font-family:var(--vt);font-size:23px;padding:3px 10px;display:flex;align-items:center;gap:6px;box-shadow:0 0 0 3px var(--ink)}
.skill-card.green .sc-flag{background:#1f8a31}.skill-card.gray .sc-flag{background:#6b7280}
.hub-sum{margin-top:32px}
.banner-win{display:inline-flex;align-items:center;gap:14px;margin:18px auto 0;background:var(--yel);padding:12px 18px;box-shadow:0 0 0 4px var(--ink);font-size:28px}
.banner-win b{font-weight:400}
.banner-lose{display:inline-flex;align-items:center;gap:12px;margin:18px auto 0;background:#ffd0d0;color:#a01616;padding:10px 16px;box-shadow:0 0 0 4px var(--ink);font-size:24px}
.no-copy .q-text,.no-copy .opt{-webkit-user-select:none;user-select:none}
.passage mark{background:#fff176;color:inherit;padding:0 1px;cursor:pointer}
.hl-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;font:700 14px var(--read);color:#6b3fc7;background:#f6f0ff;border:2px dashed #c39bff;padding:4px 8px;margin:0 0 10px}
.prob-list{font:600 16px/1.6 var(--read);margin:8px 0 0;padding-left:22px;color:#a01616}
.av-wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center;text-align:left;max-width:980px;margin:0 auto}
.av-left{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.av-h{font:400 26px var(--vt);margin:14px 0 4px;border-bottom:3px dashed #d9cba0;padding-bottom:2px}
.av-prev{background:#fff;box-shadow:0 0 0 4px var(--ink);padding:18px 26px;animation:bob 1s steps(2) infinite}
.av-side{flex:1;min-width:260px}.av-sw{width:38px;height:38px;margin:2px}.av-sw.on{outline:4px solid var(--ink);outline-offset:2px}.av-sw:disabled{opacity:.3;cursor:not-allowed}
button.who{border:0;cursor:pointer;font-family:var(--vt);color:var(--ink)}
.p-tabs{margin:0 0 12px}.p-tabs .tab{flex:0 1 auto}
.part-h{background:#2fa8e0;color:#fff;font-size:14px;padding:10px 14px;margin:6px 0 14px;font-weight:400}
.hist-list{text-align:left;padding:14px 18px}
.hist{width:calc(100% - 8px);border:0;cursor:pointer;font-family:var(--vt);color:var(--ink);text-align:left;transition:transform .08s}.hist:hover{transform:translateY(-3px)}
.hist-ic{width:56px;height:56px}.hist-score{font-size:24px}.hist-go{font-weight:400;font-size:22px;color:#1e5fd4}
.ai-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
.ai-col{background:#fff;border:3px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ai-step{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--ink);color:var(--yel);font:400 14px var(--px)}
.ai-h{margin:0;font:400 24px var(--vt)}
@media (max-width:700px){.ai-cols{grid-template-columns:1fr}}
/* nhạc nền */
.mz{--bd:var(--ink);position:fixed;left:10px;bottom:10px;z-index:90;display:flex;align-items:center;gap:8px;background:var(--cream);padding:6px 8px;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -4px 0 0 rgba(0,0,0,.12)}
.mz-disc{image-rendering:pixelated;display:block}
.mz.on .mz-disc{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mz-info{line-height:1.05;max-width:140px}.mz-t{font-size:16px;color:#6b3fc7}.mz-name{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mz-btn{width:38px;height:38px;border:3px solid var(--ink);background:var(--yel);font:700 16px var(--read);cursor:pointer;padding:0;line-height:1}
.mz-btn:hover{background:#fff}
@media (max-width:520px){.mz-info{display:none}.mz{padding:4px 6px}}
.exm{display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(#e6f4ff,#fff8e8);border:3px solid var(--ink);padding:14px 12px 10px;margin:0 0 12px}
.exm-bubble{position:relative;width:min(620px,100%);background:#fff;border:4px solid var(--ink);padding:10px 14px;min-height:96px;margin-bottom:10px}
.exm-bubble::after{content:'';position:absolute;left:calc(50% - 10px);bottom:-14px;border:10px solid transparent;border-top-color:var(--ink);border-bottom:0}
.exm-text{font:700 19px/1.5 var(--read);white-space:pre-wrap;margin-top:6px;min-height:58px}
.exm-face{image-rendering:pixelated;max-width:100%;height:auto}
.exm-name{font-size:10px;letter-spacing:1px}
.cue-card{background:#fff9db;border:3px dashed var(--ink);padding:12px 16px;font:700 18px/1.6 var(--read);white-space:pre-wrap;text-align:left;margin:0 auto 12px;max-width:620px}
.cue-card b{display:block;font-size:11px;margin-bottom:6px;color:#6b3fc7}
.prep{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0 10px}.prep-cap{font-size:20px}.prep-clock{font-size:34px}
.step-part{align-self:center;font-size:9px;color:#6b3fc7;margin:0 2px 0 8px}
.month-nav{display:flex;align-items:center;gap:6px;background:#fff8e8;padding:2px 6px;box-shadow:0 0 0 3px var(--ink)}
.month-name{font-weight:400;font-size:22px;min-width:150px;text-align:center}
.sc-old{font-size:18px;color:#b85c00;margin-top:2px}
.pw-box{font:700 20px var(--read);background:#fff;border:3px dashed var(--ink);padding:10px 14px;margin:8px 0;user-select:all}
/* nhóm câu IELTS */
.grp{margin:0 0 26px}
.grp-h{display:inline-block;background:var(--ink);color:var(--yel);font-size:12px;padding:8px 12px;margin:0 0 10px;line-height:1.3}
.grp .instr{white-space:pre-line}
.opt-box{background:#fff9db;border:3px solid var(--ink);padding:10px 14px;margin:0 4px 16px;font:600 16px/1.6 var(--read)}
.opt-box>b{display:block;font-family:var(--vt);font-weight:400;font-size:24px;margin-bottom:4px}
.opt-box ul{list-style:none;margin:0;padding:0}
.opt-box li b{display:inline-block;min-width:34px}
.opt-box ul.bank{display:flex;flex-wrap:wrap;gap:4px 22px}
.q-no.wide{width:auto;padding:0 6px}
.gap-text{font:400 17px/2.3 var(--read)}
.gap{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin:0 2px}
.gap-no{font:800 13px var(--read);background:var(--ink);color:#fff;padding:1px 6px}
.gap-in{font:600 16px var(--read);border:0;border-bottom:3px solid var(--ink);background:#fffbe6;padding:2px 6px;width:150px;max-width:60vw}
.gap-in:focus{outline:3px solid #59b8ff;outline-offset:1px}
.gap-in.over{border-bottom-color:#c62828;background:#ffe3df}
.gap-in.good{background:#c8f4c4;border-bottom-color:#1f8a31}.gap-in.bad{background:#ffd0d0;border-bottom-color:#c62828}
.gap-ans{font:700 14px var(--read);margin-left:4px}
.grp-edit{background:#f3ecd2;padding:12px 14px;margin:6px 4px 22px;border:3px solid var(--ink)}
.grp-name{font-size:24px;font-weight:400}
.alert-box{--bd:#c62828;background:#ffe3df}
.lp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}

/* ---------- bản đồ lộ trình ---------- */
.road-bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:8px 10px;background:rgba(29,26,47,.94)}
.road-chip{--bd:#fff;display:flex;align-items:center;gap:10px;background:var(--c);padding:6px 14px;margin:4px;color:#fff;font-size:26px}
.road-chip b{font-size:13px;font-weight:400;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.road-stats{display:flex;flex-wrap:wrap;justify-content:center}
.road-stats .chip{margin:4px 6px;font-size:20px}
.map-center{display:flex;justify-content:center;padding:6px 8px 20px}
.map-host{position:relative;overflow:hidden;image-rendering:pixelated;flex:none}
.map-canvas{position:absolute;left:0;top:0;image-rendering:pixelated}
.map-host>*:not(canvas){position:absolute}
.road-title{left:14px;top:14px;font-family:var(--px);font-size:min(40px,9.4vw);line-height:1.25;z-index:2;pointer-events:none;letter-spacing:2px}
.road-title span{-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 rgba(0,0,0,.2)}
.start-sign{--bd:#14301f;width:130px;height:54px;background:#69b04f;color:#fff;font-family:var(--px);font-size:19px;display:flex;align-items:center;justify-content:center;z-index:3;text-shadow:3px 3px 0 #14301f;margin:4px}
.pin{z-index:3}
.pin.todo{animation:bob 1.1s steps(2) infinite}
.node,.goal-box{z-index:4;display:flex;flex-direction:column;text-align:left;padding:8px 10px 0;border:0;font-family:var(--vt);color:var(--ink);cursor:pointer;overflow:hidden;transition:transform .08s;margin:0}
.node.red{--bd:#c62828;background:#ffe3df}.node.green{--bd:#1f8a31;background:#dcf8d6}
.node:hover,.goal-box:hover{transform:translateY(-4px)}
.n-top{font-size:17px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-title{font-size:26px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.n-info{font-size:19px;color:#333;line-height:1.1;min-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-dl{font-size:18px;color:#2d6a3e;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-dl.over{color:#c62828}.n-dl.soon,.n-dl.late{color:#b85c00}
.n-ribbon{margin:auto -10px 0;padding:3px 10px 2px;font-family:var(--vt);font-size:23px;letter-spacing:1px;color:#fff;display:flex;align-items:center;gap:6px;background:var(--bd);white-space:nowrap}
.goal-box{align-items:center;justify-content:center;text-align:center;padding:10px}
.goal-box.gray{--bd:#6b7280;background:#e6e6e6}.goal-box.green{--bd:#1f8a31;background:#dcf8d6}
.g-t{font-family:var(--vt);font-size:32px;margin-bottom:8px;letter-spacing:2px}
.g-s{font-size:23px;line-height:1.15;display:flex;gap:8px;align-items:center;justify-content:center}
.trophy{z-index:5;pointer-events:none}
.trophy.shine{animation:bob .6s steps(2) infinite;filter:drop-shadow(0 0 10px #ffe36e)}
.avatar{z-index:8;pointer-events:none;width:64px;animation:bob .5s steps(2) infinite}
.empty-note{z-index:5;text-align:center;font-size:24px}
.empty-note p{font:600 16px/1.5 var(--read);margin:8px 0 0}

/* ---------- khung làm bài ---------- */
.arena{position:relative;z-index:2;max-width:1220px;margin:14px auto 40px;border:5px solid #fff;border-radius:30px;background:var(--paper);padding:14px;box-shadow:0 0 0 5px rgba(255,255,255,.25),0 14px 0 rgba(0,0,0,.22)}
.arena-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-bottom:10px;border-bottom:3px dashed #d9cba0;margin-bottom:12px}
.arena-title{display:flex;align-items:center;gap:10px;flex:1;min-width:180px;font-size:30px;line-height:1.05}
.clocks{display:flex;flex-wrap:wrap;gap:6px}
.clk{background:var(--ink);color:#fff;font-family:var(--vt);font-size:21px;padding:5px 10px;line-height:1.1}
.clk b{font-weight:400;color:var(--yel);font-size:26px;margin-left:6px}
.clk.alt{background:#4b2fa8}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.one-col{max-width:820px;margin:0 auto}
.pane{background:#fff;padding:16px;margin:4px;min-width:0}
.split .pane{max-height:calc(100vh - 130px);overflow:auto}
.pane-h{font-family:var(--vt);font-weight:400;font-size:28px;line-height:1.1;margin:0 0 12px;color:var(--ink);letter-spacing:.5px}
.instr{font:italic 700 16px/1.5 var(--read);background:#fff6d6;border-left:6px solid var(--yel);padding:8px 12px;margin:0 0 12px}
.rich-view{font:400 17px/1.75 var(--read);word-wrap:break-word}
.rich-view p,.rich-view div{margin:0 0 .7em}
.rich-view img,.ed-area img{max-width:100%;height:auto}
.rich-view table,.ed-area table{border-collapse:collapse}
.rich-view td,.rich-view th,.ed-area td,.ed-area th{border:1px solid #999;padding:4px 8px}
.rich-view.paper{background:#fffdf5;border:2px dashed #cbbf9a;padding:12px 14px}
.qs{margin-top:4px}
.q-card{display:flex;gap:12px;padding:12px;margin:6px 4px 18px;background:#fffdf5}
.q-card.good{--bd:#2fb344;background:#f0fff0}.q-card.bad{--bd:#e03b3b;background:#fff1f1}
.q-no{flex:none;width:34px;height:34px;background:var(--ink);color:#fff;font-family:var(--px);font-size:12px;display:grid;place-items:center}
.q-main{min-width:0;flex:1}
.q-text{font:700 17px/1.55 var(--read);margin-bottom:8px;white-space:pre-wrap;word-wrap:break-word}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.mcq{flex-direction:column;align-items:stretch}
.opt{display:flex;gap:10px;align-items:center;text-align:left;font:600 16px/1.4 var(--read);padding:8px 12px;background:#fff;border:3px solid var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--cream)}
.opt.sel{background:var(--yel)}
.opt.right{background:#b9f5b4;border-color:#1f8a31}
.opt.wrongsel{background:#ffc4c4;border-color:#c62828;text-decoration:line-through}
.opt:disabled{cursor:default;color:var(--ink)}
.opt-l{flex:none;width:26px;height:26px;background:var(--ink);color:#fff;font-family:var(--px);font-size:11px;display:grid;place-items:center;text-decoration:none}
.opts.tfng .opt,.opts.ynng .opt{font-family:var(--px);font-size:11px;padding:11px 12px;line-height:1.3}
.opts.map .opt{padding:6px 8px}
.fill-input{width:100%;max-width:360px;border:3px solid var(--ink);padding:8px 10px;font:600 17px var(--read);background:#fff}
.ans-line{margin-top:8px;font:700 15px/1.5 var(--read);display:flex;flex-wrap:wrap;gap:4px 20px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:-16px;background:#fff;padding:8px 0}
.res-banner{display:flex;flex-wrap:wrap;margin:0 0 10px}
.player{background:#efe9ff;padding:12px;margin:0 0 14px;box-shadow:0 0 0 3px var(--ink)}
.player-h{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:8px}
.player audio,.sp-review audio,.sp-audio audio,.rec-zone audio,.rc-zone audio{width:100%;max-width:100%}
.map-fig{margin:12px 0}
.map-fig img,.task-img{max-width:100%;height:auto;border:3px solid var(--ink);cursor:zoom-in;background:#fff}
.map-fig figcaption{font:600 13px var(--read);color:#666}
.zoom-img{max-width:100%;height:auto}
.dict-row{margin:0 0 16px}
.dict-n{font-family:var(--vt);font-size:24px;margin-bottom:4px}
.dict-n small{font-family:var(--vt);font-size:19px;color:#666}
.dict-ta{width:100%;font:600 17px/1.5 var(--read);padding:8px 10px;border:3px solid var(--ink);resize:vertical;background:#fff}
.dict-res{margin-top:6px;padding:8px 10px;background:#fffdf5;border:2px dashed #cbbf9a}
.dict-line{font:600 17px/2 var(--read)}
.dok{color:#1b6e1b}
.dmiss{background:#ffd0d0;color:#a01616;text-decoration:underline wavy;padding:0 4px}
.dext{background:#ffe0b2;color:#a04a00;text-decoration:line-through;padding:0 4px}
.dsub{background:#fff3b0;padding:0 4px}.dsub s{color:#a01616}.dsub b{color:#1b6e1b}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font:700 14px var(--read)}
.legend span{padding:2px 8px}.legend .dok{background:#e2f7df}
.fb-box{background:#fff9db;border:3px solid var(--ink);padding:10px 14px;margin:0 0 14px}
.fb-box>b{display:block;font-family:var(--vt);font-weight:400;font-size:24px;margin-bottom:6px}
.orig{margin-top:12px;font:700 15px var(--read)}
.orig summary{cursor:pointer;margin-bottom:8px}

/* ---------- Speaking ---------- */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.step{width:46px;height:46px;font-family:var(--px);font-size:13px;color:#fff;border:0;cursor:pointer;margin:4px;padding:0}
.step.red{background:#ef4b4b}.step.green{background:#2fb344}
.step.cur{outline:4px solid var(--yel);outline-offset:4px;transform:translateY(-3px)}
.rec-card{background:#fff;border:3px solid var(--ink);padding:16px}
.rc-head{display:flex;flex-wrap:wrap}
.rc-q{font:800 22px/1.45 var(--read);margin:8px 0 14px}
.rc-zone{text-align:center}
.rec-btn{--bd:var(--ink);display:inline-flex;flex-direction:column;align-items:center;gap:10px;margin:14px auto;padding:18px 30px;background:#ff7676;border:0;font-family:var(--vt);font-size:28px;cursor:pointer;color:var(--ink);line-height:1.5}
.rec-btn.on{background:#fff;animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.stop-sq{width:26px;height:26px;background:#e53935;display:block}
.rec-live{font-family:var(--vt);font-size:26px;display:flex;align-items:center;justify-content:center;gap:8px;color:#c62828;margin:6px 0}
.rec-live.ok{color:#1f8a31}
.rec-dot{width:14px;height:14px;background:#e53935;display:block;animation:pulse .8s steps(2) infinite}
.meter{margin:12px 0;text-align:center}
.m-time{font-size:18px;display:block;margin-bottom:6px}
.m-bar{position:relative;display:flex;height:28px;border:3px solid var(--ink);margin:10px 0}
.m-bar .z{display:grid;place-items:center;font:700 14px var(--read);overflow:hidden;white-space:nowrap}
.z1{width:25%;background:#ffb4b4}.z2{width:41.67%;background:#b9f5b4}.z3{width:33.33%;background:#ffd9a0}
.m-mark{position:absolute;top:-8px;bottom:-8px;width:6px;background:var(--ink);transition:left .1s linear;margin-left:-3px}
.m-msg{font:800 16px/1.5 var(--read);min-height:24px}
.meter.low .m-msg{color:#c62828}.meter.high .m-msg{color:#b85c00}.meter.ok .m-msg{color:#1f8a31}
.rc-nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.rc-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sp-review,.sp-grade{display:flex;gap:12px;margin:0 0 18px}
.sp-grade{flex-direction:column;background:#fffdf5;border:3px solid var(--ink);padding:12px}
.sp-grade-h{display:flex;gap:12px;align-items:flex-start}
.sp-audio{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.sp-audio audio{flex:1;min-width:220px}

/* ---------- trình soạn thảo ---------- */
.editor{border:3px solid var(--ink);background:#fff}
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;background:#efe6c8;border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:6}
.tb-btn{background:#fff;border:2px solid var(--ink);cursor:pointer;min-width:34px;height:34px;padding:0 8px;font:700 16px var(--read);line-height:1}
.tb-btn:hover{background:var(--yel)}
.tb-btn.b{font-weight:900}.tb-btn.i{font-style:italic}.tb-btn.u{text-decoration:underline}.tb-btn.s{text-decoration:line-through}
.tb-btn.tb-a{border-bottom:6px solid #e53935}.tb-btn.tb-hl{background:#fff176}
.tb-wrap{position:relative;display:inline-block}
.tb-pop{position:absolute;top:100%;left:0;z-index:40;background:#fff;border:3px solid var(--ink);padding:6px;display:flex;flex-wrap:wrap;gap:4px;width:172px;margin-top:4px}

<noscript>Trang này cần bật JavaScript để chạy.</noscript>
<script>
'use strict';
// ===== LÕI: trạng thái, điều hướng, hộp thoại, đồng hồ, chấm điểm =====
const S={role:null,student:null,name:'',hearts:3,view:{name:'login',params:{}},sfx:true,lastDone:{}};
const VIEWS={};
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else if(k==='html')e.innerHTML=v;
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)));});
  return e;
}
// append/replaceChildren gốc của trình duyệt in chữ "null" khi gặp null → bỏ qua null/false giống h() (sửa một lần cho mọi chỗ)
for(const m of ['append','replaceChildren']){const f=Element.prototype[m];Element.prototype[m]=function(...k){return f.apply(this,k.flat(Infinity).filter(x=>x!=null&&x!==false));};}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const p2=n=>String(n).padStart(2,'0');
function fmtT(s){s=Math.max(0,Math.round(s||0));const hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;return (hh?hh+':':'')+p2(mm)+':'+p2(ss);}
function fmtDate(ts){const d=new Date(ts);return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;}
function rel(ms){const m=Math.max(1,Math.floor(ms/60000));if(m<60)return m+' phút';const hh=Math.floor(m/60);if(hh<48)return hh+' giờ';return Math.floor(hh/24)+' ngày';}
function dlInfo(a,sub){
  if(!a.deadline)return null;
  if(sub&&sub.status==='submitted'){const late=sub.submittedAt>a.deadline;return {text:'Hạn '+fmtDate(a.deadline)+(late?' · nộp trễ · mất 1 ♥':''),cls:late?'late':'ok'};}
  const left=a.deadline-Date.now();
  if(left<0)return {text:'QUÁ HẠN '+rel(-left)+' · mất 1 ♥',cls:'over'};
  return {text:'Hạn '+fmtDate(a.deadline)+' · còn '+rel(left),cls:left<86400000?'soon':'ok'};
}
const hasAns=v=>v!==undefined&&v!==null&&String(v).trim()!=='';

// điều hướng
let cleanups=[];
function onCleanup(fn){cleanups.push(fn);}
function cleanup(){cleanups.splice(0).forEach(f=>{try{f();}catch(e){console.warn(e);}});}
// mỗi lần chuyển màn hình đều tải lại dữ liệu mới nhất từ máy chủ
async function go(name,params={}){
  cleanup();
  if(S.role&&name!=='login'){try{await loadAll();}catch(e){if(e.status===401)return;toast(e.message,'bad');}}
  S.view={name,params};render();window.scrollTo(0,0);
}
function render(){
  const app=$('#app');app.replaceChildren();
  const v=VIEWS[S.view.name];
  try{app.append(v(S.view.params));}catch(e){console.error(e);app.append(h('div',{class:'panel',style:{margin:'20px'}},'Có lỗi khi hiển thị màn hình này: '+e.message));}
}

// âm thanh
let AC=null;
function beep(f=660,d=.08,type='square',v=.04,when=0){
  if(!S.sfx)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+when;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}
}
const fanfare=()=>[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,.16,'square',.05,i*.13));

// ===== NHẠC NỀN: phát lần lượt các file nhạc trong thư mục public/music =====
const Music={list:[],i:0,on:false,want:true,holds:0,au:null,fails:0,ui:()=>{},
  load(){try{const v=JSON.parse(localStorage.getItem('iq-music')||'{}');this.want=v.on!==false;this.i=v.i|0;}catch(e){this.want=true;}},
  save(){try{localStorage.setItem('iq-music',JSON.stringify({on:this.on,i:this.i}));}catch(e){}},
  async fetchList(){try{const r=await fetch('music/playlist.json',{cache:'no-cache'});this.list=r.ok?await r.json():[];}catch(e){this.list=[];}if(!(this.i<this.list.length))this.i=0;},
  audio(){
    if(this.au)return this.au;
    const au=this.au=new Audio();au.preload='auto';au.volume=.35;
    au.onended=()=>this.skip();
    au.onplaying=()=>{this.fails=0;};
    au.onerror=()=>{if(this.on&&++this.fails<this.list.length)setTimeout(()=>this.skip(),400);}; // file hỏng → sang bài khác
    return au;
  },
  load_(){const au=this.audio(),t=this.list[this.i];if(t&&au.dataset.i!==String(this.i)){au.src=t.file;au.dataset.i=String(this.i);}return au;},
  play(){if(!this.list.length)return;const au=this.load_();this.on=true;if(!this.holds)au.play().catch(()=>{});this.save();this.ui();},
  pause(){this.on=false;if(this.au)this.au.pause();this.save();this.ui();},
  toggle(){this.on?this.pause():this.play();},
  skip(){if(!this.list.length)return;this.i=(this.i+1)%this.list.length;const au=this.load_();au.currentTime=0;if(!this.on)return this.play();if(!this.holds)au.play().catch(()=>{});this.save();this.ui();},
  // tạm tắt khi đang nghe bài Listening / ghi âm Speaking, tự bật lại khi rời màn hình đó
  hold(){this.holds++;if(this.au)this.au.pause();this.ui();},
  release(){this.holds=Math.max(0,this.holds-1);if(!this.holds&&this.on&&this.au)this.au.play().catch(()=>{});this.ui();},
};
// đĩa nhạc pixel 16×16, nhãn giữa đổi màu theo bài
function discSprite(color){
  const c=cv(16,16),x=c.getContext('2d');
  for(let y=0;y<16;y++)for(let i=0;i<16;i++){
    const r=Math.hypot(i+.5-8,y+.5-8);
    let col=null;
    if(r<=7.6)col='#1d1a2f';
    if(r>4&&r<=7.6&&(Math.round(r*2)%3===0))col='#3a3550';
    if(r<=3.4)col=color;
    if(r<=1.1)col='#fff8e8';
    if(r>5&&r<7&&i<7&&y<7&&i+y>5&&i+y<8)col='#8a84a8'; // vệt sáng
    if(col){x.fillStyle=col;x.fillRect(i,y,1,1);}
  }
  return c.toDataURL();
}
const DISC_COLORS=['#ffd23f','#8ec5ff','#ef4b4b','#c39bff','#7be06b','#ff9eb0','#f08a24'];
async function musicWidget(){
  await Music.fetchList();
  if(!Music.list.length){setTimeout(musicWidget,30000);return;} // chưa có nhạc trong public/music → 30 giây sau xem lại
  const img=h('img',{class:'mz-disc',alt:'',width:48,height:48,draggable:'false'});
  const name=h('div',{class:'mz-name'});
  const play=h('button',{class:'mz-btn',onclick:()=>Music.toggle()}),next=h('button',{class:'mz-btn','aria-label':'Đổi bài',title:'Đổi bài',onclick:()=>Music.skip()},'⏭');
  const el=h('div',{class:'mz',role:'region','aria-label':'Nhạc nền'},img,h('div',{class:'mz-info'},h('div',{class:'mz-t'},'♪ NHẠC NỀN'),name),play,next);
  Music.ui=()=>{
    const T=Music.list[Music.i];
    img.src=discSprite(DISC_COLORS[Music.i%DISC_COLORS.length]);el.classList.toggle('on',Music.on&&!Music.holds);el.hidden=Music.holds>0; // đang làm bài: ẩn hẳn
    play.textContent=Music.on?'❚❚':'▶';play.setAttribute('aria-label',Music.on?'Tạm dừng nhạc':'Phát nhạc');play.title=play.getAttribute('aria-label');
    name.textContent=T.name+(Music.on&&Music.holds?' · tạm tắt khi nghe/nói':'');name.title=T.name;
  };
  Music.load();if(Music.i>=Music.list.length)Music.i=0;Music.ui();document.body.append(el);
  // trình duyệt chỉ cho phát nhạc sau khi người dùng bấm vào trang lần đầu
  const start=e=>{document.removeEventListener('pointerdown',start,true);document.removeEventListener('keydown',start,true);if(Music.want&&!Music.on&&!el.contains(e.target))Music.play();};
  document.addEventListener('pointerdown',start,true);document.addEventListener('keydown',start,true);
}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.btn,.opt,.node,.skill-card,.step'))beep(520,.05);});

// thông báo nhỏ + hộp thoại kiểu game
function toast(msg,kind='ok'){
  const t=h('div',{class:'toast '+kind,role:'status'},msg);document.body.append(t);
  setTimeout(()=>t.remove(),3200);
}
function dialog({title='THÔNG BÁO',body,buttons=[],cls='',closable=true}){
  return new Promise(res=>{
    const prev=document.activeElement;
    const wrap=h('div',{class:'dlg-wrap'});
    const close=v=>{wrap.remove();if(prev&&prev.focus)try{prev.focus();}catch(e){}res(v);};
    const dlg=h('div',{class:'dlg '+cls,role:'dialog','aria-modal':'true','aria-label':title,tabindex:'-1'},
      h('div',{class:'dlg-bar'},h('span',{},title),closable&&h('button',{class:'dlg-x','aria-label':'Đóng',onclick:()=>close(null)},'×')),
      h('div',{class:'dlg-body'},body),
      buttons.length?h('div',{class:'dlg-foot'},buttons.map(b=>h('button',{class:'btn '+(b.cls||''),onclick:()=>close(b.value)},b.label))):null);
    wrap.append(dlg);document.body.append(wrap);
    wrap.addEventListener('keydown',e=>{if(e.key==='Escape'&&closable)close(null);});
    (dlg.querySelector('.dlg-foot .btn')||dlg).focus();
    dlg.close=close;wrap._close=close;
  });
}
async function confirmDlg(msg,{yes='ĐỒNG Ý',no='HỦY',title='XÁC NHẬN',danger=false}={}){
  return (await dialog({title,body:h('p',{class:'dlg-msg'},msg),buttons:[{label:no,value:false,cls:'btn-ghost'},{label:yes,value:true,cls:danger?'btn-red':'btn-green'}]}))===true;
}
function alertDlg(msg,title='THÔNG BÁO',cls=''){return dialog({title,body:typeof msg==='string'?h('p',{class:'dlg-msg'},msg):msg,buttons:[{label:'OK',value:true,cls:'btn-green'}],cls});}
function confetti(host,n=46){
  const cols=['#ffd23f','#ef4b4b','#2fb344','#4cc3f2','#ff7eb6','#8e5de6'];
  const box=h('div',{class:'confetti','aria-hidden':'true'});
  for(let i=0;i<n;i++)box.append(h('i',{style:{left:Math.random()*100+'%',background:cols[i%cols.length],animationDelay:(Math.random()*1.2)+'s',animationDuration:(2+Math.random()*2)+'s','--dx':(Math.random()*160-80)+'px'}}));
  host.append(box);setTimeout(()=>box.remove(),6000);
}

// đồng hồ làm bài: chỉ tính khi tab đang mở; máy chủ giữ tổng thời gian
// chống gian lận: rời khỏi bài (chuyển tab, mở ứng dụng khác) sẽ bị ghi lại cho cô xem
const Timer={sub:null,acc:0,last:0,id:null,sv:null,on:null,_v:null,_b:null,_f:null,away:false,
  start(sub,onTick){
    this.stop();this.sub=sub;this.acc=0;this.last=performance.now();this.on=onTick;this.away=false;
    this.id=setInterval(()=>this.tick(),500);
    this._v=()=>{this.tick();this.last=performance.now();document.hidden?this.leave():this.back();};document.addEventListener('visibilitychange',this._v);
    this._b=()=>this.leave();this._f=()=>this.back();window.addEventListener('blur',this._b);window.addEventListener('focus',this._f);
    this.sv=setInterval(()=>this.commit(),15000);
    onCleanup(()=>this.stop());
  },
  tick(){const n=performance.now();if(!document.hidden)this.acc+=(n-this.last)/1000;this.last=n;this.on&&this.on();},
  total(){return (this.sub?this.sub.timeSec||0:0)+this.acc;},
  leave(){
    if(this.away||Rec.asking||!this.sub)return;this.away=true;
    api('/api/leave/'+this.sub.aid,{}).then(r=>{this.sub.leaves=r.leaves;}).catch(()=>{});
  },
  back(){
    if(!this.away)return;this.away=false;
    beep(180,.25,'sawtooth');
    alertDlg(`Em vừa rời khỏi bài làm${this.sub&&this.sub.leaves?' (lần thứ '+this.sub.leaves+')':''}. Cô giáo sẽ thấy số lần em rời bài. Hãy tập trung làm bài nhé!`,'CẢNH BÁO');
  },
  async commit(){
    if(!this.sub)return;const w=Math.floor(this.acc);
    if(w<=0)return;this.acc-=w;
    try{const r=await api('/api/beat/'+this.sub.aid,{sec:w});this.sub.timeSec=r.timeSec;}catch(e){this.acc+=w;}
  },
  async stop(){
    if(!this.id)return;
    this.tick();clearInterval(this.id);clearInterval(this.sv);document.removeEventListener('visibilitychange',this._v);
    window.removeEventListener('blur',this._b);window.removeEventListener('focus',this._f);this.id=null;this.sv=null;
    await this.commit();this.sub=null;
  }
};
let _saveT=null;
function saveSoon(sub){clearTimeout(_saveT);_saveT=setTimeout(()=>saveSub(sub),600);}

// ===== hiển thị đáp án (chấm điểm chạy trên máy chủ) =====
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function dictOpsView(ops){
  const d=h('div',{class:'dict-line'});
  ops.forEach(o=>{
    if(o.t==='ok')d.append(h('span',{class:'dok'},o.w),' ');
    else if(o.t==='miss')d.append(h('span',{class:'dmiss',title:'Thiếu từ'},o.w),' ');
    else if(o.t==='extra')d.append(h('span',{class:'dext',title:'Thừa từ'},o.w),' ');
    else d.append(h('span',{class:'dsub',title:'Sai từ'},h('s',{},o.hyp),' → ',h('b',{},o.ref)),' ');
  });
  return d;
}
// ===== SPRITES: toàn bộ hình pixel được vẽ bằng code (không dùng ảnh ngoài) =====
const PAL={K:'#1d1a2f',W:'#fff8e1',R:'#ef4b4b',Y:'#ffd23f',O:'#f08a24',G:'#2fb344',B:'#7a4a21',P:'#ff7eb6',S:'#ffd7b5',H:'#ffd36a',D:'#1c6b34',L:'#62d36f',C:'#c9d3e0',U:'#7b4bd6'};
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function mk(rows,pal){
  pal=Object.assign({},PAL,pal||{});
  const w=Math.max(...rows.map(r=>r.length)),hh=rows.length,c=cv(w,hh),x=c.getContext('2d');
  rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,y,1,1);}}});
  return {url:c.toDataURL(),w,h:hh,canvas:c};
}
function px(sp,scale=4,cls=''){
  const i=new Image();i.src=sp.url;i.width=sp.w*scale;i.height=sp.h*scale;
  i.className='spr '+cls;i.alt='';i.draggable=false;return i;
}
const SP={};
const PIN=['...KKKKK...','..KRRRRRK..','.KRRRRRRRK.','KRRRWWWRRRK','KRRWWWWWRRK','KRRWWWWWRRK','KRRRWWWRRRK','.KRRRRRRRK.','..KRRRRRK..','...KRRRK...','...KRRRK...','....KRK....','....KKK....'];
SP.pinRed=mk(PIN);

// nhân vật lưu theo kiểu cũ (outfit, glasses/hat/beard là đúng/sai) vẫn hiện đúng
function avNorm(cfg){
  const v={...(cfg||{})};
  if(v.outfit&&!v.top)v.top=v.outfit;
  if(typeof v.glasses==='boolean')v.glasses=v.glasses?'regular':'none';
  if(typeof v.hat==='boolean')v.hat=v.hat?'beret':'none';
  if(typeof v.beard==='boolean')v.beard=v.beard?'full':'none';
  if(!v.hairStyle)v.hairStyle=v.gender==='boy'?'short':'long';
  if(!v.bottom)v.bottom=v.top==='uniform'&&v.gender!=='boy'?'skirt':'pants';
  const c={...AV_DEFAULT,...v};delete c.outfit;
  for(const k in AV_OPT)if(!AV_OPT[k].some(([x])=>x===c[k]))c[k]=AV_DEFAULT[k];
  const F=AV_FOR[c.gender];for(const k in F)if(!F[k].includes(c[k]))c[k]=F[k][0];
  return c;
}
// f<1: tối hơn, f>1: sáng hơn
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  return '#'+[n>>16,n>>8&255,n&255].map(v=>Math.round(f<1?v*f:v+(255-v)*(f-1))).map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
}

function tileBrick(){
  const c=cv(16,24),x=c.getContext('2d');
  x.fillStyle='#8be26a';x.fillRect(0,0,16,2);

  x.fillStyle='#c9552e';x.fillRect(0,8,16,16);
  x.fillStyle='#7d2c18';
  for(let r=0;r<2;r++){const y=8+r*8;x.fillRect(0,y+7,16,1);const o=r?3:7;x.fillRect(o,y,1,7);x.fillRect(o+8,y,1,7);}

async function api(url,body,method){
  const opt={method:method||(body===undefined?'GET':'POST'),headers:{}};
  if(body!==undefined){opt.body=JSON.stringify(body);opt.headers['Content-Type']='application/json';}
  let r;
  for(let tries=0;;tries++){
    const retry=opt.method==='GET'&&tries<6;
    try{r=await fetch(url,opt);}
    catch(e){if(retry){if(tries===0)toast('Đang kết nối máy chủ, em đợi chút nhé...');await sleep(5000);continue;}const err=new Error('Mất kết nối mạng. Kiểm tra mạng rồi thử lại nhé!');err.status=0;throw err;}
    if(retry&&[502,503,504].includes(r.status)){if(tries===0)toast('Máy chủ đang khởi động, em đợi khoảng 1 phút nhé...');await sleep(5000);continue;}
    break;
  }
  const data=await r.json().catch(()=>({}));
  if(!r.ok){
    const err=new Error(data.error||'Có lỗi, hãy thử lại.');err.status=r.status;err.problems=data.problems;
    if(r.status===401&&S.role){S.role=null;toast('Phiên đăng nhập đã hết. Em đăng nhập lại nhé!','bad');go('login');}
    throw err;
  }
  return data;
}

const OK_TAGS=new Set(['B','STRONG','I','EM','U','S','STRIKE','DEL','SPAN','FONT','P','DIV','BR','UL','OL','LI','H1','H2','H3','H4','SUB','SUP','BLOCKQUOTE','IMG','TABLE','TBODY','THEAD','TR','TD','TH','MARK','HR']);
const DROP_TAGS=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','TITLE','HEAD','SVG','MATH','FORM','INPUT','BUTTON','TEXTAREA','SELECT','NOSCRIPT']);
const OK_STYLE=new Set(['color','background-color','background','font-size','font-family','font-weight','font-style','text-decoration','text-decoration-line','text-align','text-indent','margin-left','padding-left','line-height','vertical-align']);
function cleanStyle(s){
  return String(s||'').split(';').map(d=>{const i=d.indexOf(':');if(i<0)return '';const p=d.slice(0,i).trim().toLowerCase(),v=d.slice(i+1).trim();
    if(!OK_STYLE.has(p)||/url\(|expression|javascript|@import|<|>/i.test(v))return '';return p+':'+v;}).filter(Boolean).join(';');
}
function sanitizeNode(parent){
  for(const n of [...parent.childNodes]){
    if(n.nodeType===3)continue;
    if(n.nodeType!==1){n.remove();continue;}
    const tag=n.tagName.toUpperCase();
    if(DROP_TAGS.has(tag)){n.remove();continue;}
    sanitizeNode(n);
    if(!OK_TAGS.has(tag)){n.replaceWith(...n.childNodes);continue;}
    const keep={};
    if(n.hasAttribute('style')){const s=cleanStyle(n.getAttribute('style'));if(s)keep.style=s;}
    if(tag==='FONT'){['color','face','size'].forEach(k=>{if(n.hasAttribute(k)&&!/[<>"']/.test(n.getAttribute(k)))keep[k]=n.getAttribute(k);});}
    if(tag==='IMG'){const src=n.getAttribute('src')||'';if(!/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(src)){n.remove();continue;}keep.src=src;keep.alt='';}
    if(tag==='TD'||tag==='TH'){['colspan','rowspan'].forEach(k=>{if(/^\d+$/.test(n.getAttribute(k)||''))keep[k]=n.getAttribute(k);});}
    for(const a of [...n.attributes])n.removeAttribute(a.name);
    for(const k in keep)n.setAttribute(k,keep[k]);
  }
}

const SK={

const SKS=['reading','listening','writing','speaking'];
// ===== DẠNG CÂU HỎI IELTS (Reading & Listening) =====
// mỗi bài gồm nhiều nhóm câu như đề thật: "Questions 1–5" + hướng dẫn + các câu, đánh số liên tục
// kiểu nhóm: mcq (1 đáp án), multi (chọn 2–3), tfng, ynng, match (nối với danh sách / nhãn trên hình), gap (điền vào chỗ ___)
const MAX_LISTENS=2;
const ROMAN=['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv'];
const lab=(g,k)=>g.labels==='roman'?ROMAN[k]||String(k+1):LETTERS[k];
const PRESETS=[
  {id:'mcq',name:'Multiple Choice (1 đáp án)',type:'mcq',skills:'rl',ins:'Choose the correct letter, A, B, C or D.'},
  {id:'multi',name:'Multiple Choice (chọn nhiều đáp án)',type:'multi',skills:'rl',ins:'Choose TWO letters, A–E.'},
  {id:'tfng',name:'True / False / Not Given',type:'tfng',skills:'r',ins:'Do the following statements agree with the information given in the passage?\nWrite TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this.'},
  {id:'ynng',name:'Yes / No / Not Given',type:'ynng',skills:'r',ins:'Do the following statements agree with the claims of the writer?\nWrite YES if the statement agrees with the claims of the writer, NO if the statement contradicts the claims of the writer, NOT GIVEN if it is impossible to say what the writer thinks about this.'},
  {id:'headings',name:'Matching Headings',type:'match',skills:'r',labels:'roman',title:'List of Headings',ins:'Choose the correct heading for each paragraph from the list of headings below.'},
  {id:'info',name:'Matching Information',type:'match',skills:'r',title:'',ins:'Which paragraph contains the following information?\nYou may use any letter more than once.',count:6},
  {id:'features',name:'Matching Features',type:'match',skills:'rl',title:'List of People',ins:'Look at the following statements and the list below. Match each statement with the correct option.\nYou may use any letter more than once.'},
  {id:'endings',name:'Matching Sentence Endings',type:'match',skills:'r',title:'',ins:'Complete each sentence with the correct ending, A–G, below.'},
  {id:'map',name:'Plan / Map / Diagram Labelling',type:'match',skills:'l',image:true,ins:'Label the map below.\nWrite the correct letter, A–H, next to the questions.',count:8},
  {id:'notes',name:'Form / Note / Table / Flow-chart / Summary Completion',type:'gap',skills:'rl',ins:'Complete the notes below.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.',maxWords:2},
  {id:'sentence',name:'Sentence Completion',type:'gap',skills:'rl',ins:'Complete the sentences below.\nWrite NO MORE THAN TWO WORDS for each answer.',maxWords:2},
  {id:'bank',name:'Summary Completion (chọn từ trong khung)',type:'gap',skills:'rl',bank:true,ins:'Complete the summary using the list of words, A–I, below.'},
  {id:'diagram',name:'Diagram Label Completion',type:'gap',skills:'rl',image:true,ins:'Label the diagram below.\nWrite NO MORE THAN TWO WORDS for each answer.',maxWords:2},
  {id:'short',name:'Short-answer Questions',type:'gap',skills:'rl',ins:'Answer the questions below.\nWrite NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.',maxWords:3},
];
const marksOf=(g,it)=>g.type==='multi'?(it.choose||2):1;
// số câu của từng nhóm: multi "Choose TWO" chiếm 2 số câu, như đề thật
function numberGroups(groups){
  let n=1;
  return (groups||[]).map(g=>{const start=n,nums={};(g.items||[]).forEach(it=>{const m=marksOf(g,it);nums[it.id]=m>1?`${n}–${n+m-1}`:String(n);n+=m;});return {start,end:n-1,nums};});
}
const passagesOf=a=>Array.isArray(a.passages)&&a.passages.length?a.passages:[a.passage||''];
function secRange(a,sec){const nums=numberGroups(a.groups);let lo=0,hi=0;(a.groups||[]).forEach((g,i)=>{if((g.section||1)!==sec||nums[i].end<nums[i].start)return;lo=lo||nums[i].start;hi=nums[i].end;});return lo?`${lo}–${hi}`:'';}
const totalMarks=a=>(a.groups||[]).reduce((t,g)=>t+(g.items||[]).reduce((s,it)=>s+marksOf(g,it),0),0);
const allItems=a=>(a.groups||[]).flatMap(g=>g.items||[]);
function correctText(g,it){
  if(it.answer==null||it.answer===''||(Array.isArray(it.answer)&&!it.answer.length))return '(chưa có đáp án)';
  if(g.type==='mcq')return LETTERS[+it.answer]+'. '+((it.options||[])[+it.answer]||'');
  if(g.type==='multi')return (it.answer||[]).map(k=>LETTERS[k]).join(', ');
  if(g.type==='match')return lab(g,+it.answer)+((g.options||[])[+it.answer]?'. '+g.options[+it.answer]:'');
  if(g.type==='gap')return (g.bank||[]).length?LETTERS[+it.answer]+'. '+g.bank[+it.answer]:String(it.answer).split('|').map(s=>s.trim()).filter(Boolean).join(' / ');
  return String(it.answer);
}
function badgeOf(a){
  if(a.skill==='listening'&&a.mode==='dictation')return 'DICTATION';
  if(a.skill==='reading'||a.skill==='listening'){
    const ps=[...new Set((a.groups||[]).map(g=>g.preset))];
    const nm=ps.length===1&&(PRESETS.find(p=>p.id===ps[0])||{}).name;
    return nm?nm.toUpperCase():`${totalMarks(a)} QUESTIONS`;
  }
  if(a.skill==='writing')return 'ESSAY';
  return (a.questions||[]).length+' QUESTIONS';
}
// ----- mỗi tháng là một con đường riêng: bài thuộc tháng cô giao bài; bài cũ gần START, bài mới nhất gần ĐÍCH -----
const ymOf=ts=>{const d=new Date(ts||Date.now());return d.getFullYear()+'-'+p2(d.getMonth()+1);};
const pubAt=a=>a.publishedAt||a.createdAt||a.deadline||0;
const monthOf=a=>ymOf(pubAt(a));
const thisMonth=()=>ymOf(Date.now());
const monthName=m=>{const [y,mm]=m.split('-');return `THÁNG ${+mm}/${y}`;};
function skillStats(skill,name,month){
  const as=month?skillAssignments(skill).filter(a=>monthOf(a)===month).sort((x,y)=>pubAt(x)-pubAt(y)):skillAssignments(skill);let done=0,time=0,err=0;
  as.forEach(a=>{const s=getSub(a.id,name);if(s){time+=s.timeSec||0;if(s.status==='submitted'){done++;if(s.result)err+=s.result.errors||0;}}});
  return {as,total:as.length,done,time,err};
}
const skillComplete=(k,name,month)=>{const t=skillStats(k,name,month);return t.total>0&&t.done===t.total;};
// về đích tháng này: xong hết bài của các kỹ năng có bài trong tháng
const allSkillsComplete=(name,month=thisMonth())=>{const ks=SKS.filter(k=>skillStats(k,name,month).total>0);return ks.length>0&&ks.every(k=>skillComplete(k,name,month));};
function skillOthersTime(skill,name,exceptKey){let t=0;skillAssignments(skill).forEach(a=>{const s=getSub(a.id,name);if(s&&s.key!==exceptKey)t+=s.timeSec||0;});return t;}

// ----- BẢN ĐỒ LỘ TRÌNH -----
function spline(P,seg=22){
  const out=[],g=i=>P[Math.max(0,Math.min(P.length-1,i))];
  for(let i=0;i<P.length-1;i++){
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    for(let t=0;t<seg;t++){
      const u=t/seg,u2=u*u,u3=u2*u,c=k=>.5*((2*p1[k])+(-p0[k]+p2[k])*u+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*u2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*u3);
      out.push({x:c('x'),y:c('y')});
    }
  }
  out.push(P[P.length-1]);return out;
}
function crisp(c){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=3;i<a.length;i+=4)a[i]=a[i]>=110?255:0;x.putImageData(d,0,0);}
const RC=['#ef7d73','#cdb68c','#f3d56f','#86b69a'];

function nodeInfo(a,sub){
  const done=sub&&sub.status==='submitted',lines=[];
  if(done){
    if(a.skill==='reading'||a.skill==='listening'){const r=sub.result||{};lines.push(a.mode==='dictation'?`Chính xác ${r.accuracy}% · Lỗi ${r.errors}`:`Đúng ${r.score}/${r.total} · Lỗi ${r.errors}`);}
    else if(a.skill==='writing')lines.push(`${totalWords(sub)} từ`+(sub.feedback&&sub.feedback.band?` · Band ${sub.feedback.band}`:''));
    else lines.push(`${Object.keys((sub.speaking&&sub.speaking.items)||{}).length}/${a.questions.length} câu`+(sub.feedback?' · Cô đã chấm':''));
    lines[0]+=' · ⏱ '+fmtT(sub.timeSec);
  }else if(sub&&(sub.timeSec>0))lines.push('⏱ '+fmtT(sub.timeSec));
  return lines;
}

function buildMap(host,{W,skill,items,done,month}){
  const N=items.length,M=N+1,SS=216,T=170,B=250,H=T+M*SS+B;
  const rh=W<480?22:26,bw=Math.min(300,Math.round(W*.54)),bh=128,m=10,q=4;
  host.style.height=H+'px';
  const nodes=[];
  for(let i=0;i<M;i++){
    const y=H-B-SS/2-i*SS,left=i%2===0,hug=m+bw+24+rh;
    nodes.push({i,y,left,bx:left?m:W-m-bw,rx:left?Math.min(W-rh-10,hug+30):Math.max(rh+10,W-hug-30)});
  }
  const start={x:m+130+34,y:H-62};
  const anchors=[start,...nodes.map(n=>({x:n.rx,y:n.y}))];
  const P=[...anchors];const lastP=P[P.length-1];P.push({x:lastP.x,y:lastP.y-34});
  const pts=spline(P,22);
  const rects=[{x:0,y:0,w:W*.62,h:T-14},{x:0,y:H-120,w:170,h:120}];
  nodes.forEach(n=>rects.push({x:n.bx-8,y:n.y-bh/2-76,w:bw+16,h:bh+84}));
  // vẽ nền pixel ở độ phân giải thấp rồi phóng to
  const lw=Math.ceil(W/q),lh=Math.ceil(H/q),cvs=cv(lw,lh),ctx=cvs.getContext('2d');
  const R=rng(hashStr(skill+':'+month+':'+N)); // mỗi tháng một con đường khác
  ctx.fillStyle='#6fd05a';ctx.fillRect(0,0,lw,lh);
  for(let k=0;k<lw*lh/70;k++){
    const x=Math.floor(R()*lw),y=Math.floor(R()*lh);ctx.fillStyle=R()<.7?'#5cbd48':'#84df6e';ctx.fillRect(x,y,1,1);
    if(R()<.6){ctx.fillRect(x-1,y+1,1,1);ctx.fillRect(x+1,y+1,1,1);}
  }
  const stroke=(wLow,dash,color)=>{
    const c=cv(lw,lh),x=c.getContext('2d');x.strokeStyle=color;x.lineWidth=wLow;x.lineJoin='round';x.lineCap=dash?'butt':'round';
    if(dash)x.setLineDash(dash);x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x/q,p.y/q):x.moveTo(p.x/q,p.y/q));x.stroke();crisp(c);return c;
  };
  const edge=stroke(rh*2/q+2,null,'#8b9099'),asph=stroke(rh*2/q,null,'#2e3037'),dash=stroke(1,[3,4],'#d7dae0');
  ctx.drawImage(edge,0,0);ctx.drawImage(asph,0,0);ctx.drawImage(dash,0,0);
  const md=edge.getContext('2d').getImageData(0,0,lw,lh).data;
  const roadHit=(x,y,w,hh)=>{for(let yy=Math.max(0,y);yy<Math.min(lh,y+hh);yy+=2)for(let xx=Math.max(0,x);xx<Math.min(lw,x+w);xx+=2)if(md[(yy*lw+xx)*4+3])return true;return false;};
  const rectHit=(X,Y,w,hh)=>rects.some(r=>X<r.x+r.w&&X+w>r.x&&Y<r.y+r.h&&Y+hh>r.y);
  const kinds=[[SP.pine,.5],[SP.sunflower,.17],[SP.flower,.17],[SP.mushroom,.16]],placed=[],want=Math.round(H/48);
  for(let tries=0,k=0;k<want&&tries<900;tries++){
    const r=R();let acc=0,sp=SP.pine;for(const [s,pw] of kinds){acc+=pw;if(r<=acc){sp=s;break;}}
    const x=Math.floor(R()*(lw-sp.w)),y=Math.floor(R()*(lh-sp.h-12));
    if(roadHit(x-2,y-2,sp.w+4,sp.h+4)||rectHit(x*q-6,y*q-6,sp.w*q+12,sp.h*q+12))continue;
    if(placed.some(p=>x<p.x+p.w+2&&x+sp.w+2>p.x&&y<p.y+p.h+2&&y+sp.h+2>p.y))continue;
    ctx.drawImage(sp.canvas,x,y);placed.push({x,y,w:sp.w,h:sp.h});k++;
  }
  cvs.className='map-canvas';cvs.style.width=lw*q+'px';cvs.style.height=lh*q+'px';cvs.setAttribute('aria-hidden','true');
  host.append(cvs);
  // tiêu đề ROAD MAP
  host.append(h('div',{class:'road-title','aria-hidden':'true'},
    h('div',{},'ROAD'.split('').map((c,i)=>h('span',{style:{color:RC[i%4]}},c))),
    h('div',{},'MAP'.split('').map((c,i)=>h('span',{style:{color:RC[(i+1)%4]}},c)))));
  // biển START
  host.append(h('div',{class:'start-sign','aria-hidden':'true',style:{left:m+'px',top:(H-96)+'px'}},'START'));
  // các chặng
  items.forEach((it,i)=>{
    const n=nodes[i],a=it.a,sub=it.sub,isDone=sub&&sub.status==='submitted',dl=dlInfo(a,sub),info=nodeInfo(a,sub);
    const inProg=!isDone&&sub&&(sub.timeSec>0||Object.keys(sub.answers||{}).length>0||totalWords(sub)>0||(sub.speaking&&Object.keys(sub.speaking.items||{}).length));
    host.append(
      h('div',{class:'pin '+(isDone?'done':'todo'),'aria-hidden':'true',style:{left:(n.bx+bw/2-22)+'px',top:(n.y-bh/2-62)+'px'}},px(isDone?SP.pinGreen:SP.pinRed,4)),
      h('button',{class:'node '+(isDone?'green':'red'),style:{left:n.bx+'px',top:(n.y-bh/2)+'px',width:bw+'px',height:bh+'px'},title:a.title,
        'aria-label':`Bài ${i+1}: ${a.title}. ${isDone?'Đã hoàn thành':'Chưa hoàn thành'}`,onclick:()=>go('ex',{id:a.id})},
        h('div',{class:'n-top'},`BÀI ${i+1} · ${badgeOf(a)}`),
        h('div',{class:'n-title'},a.title),
        h('div',{class:'n-info'},info.length?info:' '),
        h('div',{class:'n-dl '+(dl?dl.cls:'')},dl?dl.text:'Không có hạn nộp'),
        h('div',{class:'n-ribbon'},isDone?[px(SP.check,3),' ĐÃ HOÀN THÀNH']:(inProg?'ĐANG LÀM DỞ':'CHƯA LÀM'))));
  });
  // đích
  const g=nodes[N],complete=N>0&&done===N;
  host.append(
    h('div',{class:'trophy'+(complete?' shine':''),'aria-hidden':'true',style:{left:(g.bx+bw/2-38)+'px',top:(g.y-bh/2-76)+'px'}},px(SP.trophy,5)),
    h('button',{class:'goal-box '+(complete?'green':'gray'),style:{left:g.bx+'px',top:(g.y-bh/2)+'px',width:bw+'px',height:bh+'px'},
      onclick:()=>{if(complete)congrats(skill,month);else{toast(N===0?'Tháng này chưa có bài nào ở kỹ năng này.':`Em còn ${N-done} bài nữa mới về đích tháng này!`,'bad');beep(180,.2,'sawtooth');}}},
      h('div',{class:'g-t px'},'ĐÍCH '+monthName(month).split('/')[0]),
      h('div',{class:'g-s'},complete?'CHÚC MỪNG EM!':[px(SP.lock,3),N===0?' Chờ cô giao bài':` Hoàn thành ${done}/${N} bài để mở khóa`])));
  if(N===0)host.append(h('div',{class:'panel empty-note',style:{left:'16px',right:'16px',top:(H/2-70)+'px'}},h('b',{},'Chưa có bài nào!'),h('p',{},month===thisMonth()?'Tháng này cô chưa giao bài '+SK[skill].en+'. Em quay lại sau nhé!':'Tháng này không có bài '+SK[skill].en+'.')));
  // nhân vật đi trên đường
  const av=h('div',{class:'avatar','aria-hidden':'true'},px(myAvatar(),2));host.append(av);
  const place=pt=>{av.style.left=(pt.x-32)+'px';av.style.top=(pt.y-84)+'px';};
  const lk=skill+month,prev=S.lastDone[lk];S.lastDone[lk]=done;
  const fromK=prev===undefined?done:Math.min(prev,N),toK=done;
  place(pts[Math.min(fromK*22,pts.length-1)]);
  if(fromK!==toK){
    let idx=fromK*22;const target=toK*22,dir=target>idx?1:-1;
    const t0=setTimeout(()=>{
      const iv=setInterval(()=>{
        idx+=dir;place(pts[idx]);

        if(idx===target){clearInterval(iv);if(toK===N&&N>0&&fromK<N)setTimeout(()=>congrats(skill,month),500);}
      },28);onCleanup(()=>clearInterval(iv));
    },450);
    onCleanup(()=>clearTimeout(t0));
  }
}

    if(only&&(g.section||1)!==only)return null;

    const head=h('div',{class:'grp-h px'},N.start===N.end?`QUESTION ${N.start}`:`QUESTIONS ${N.start}–${N.end}`);
    const img=g.image&&src(a,g.image)?h('figure',{class:'map-fig'},h('img',{src:src(a,g.image),alt:'Hình của nhóm câu',onclick:()=>zoomImg(src(a,g.image))}),h('figcaption',{},'Bấm vào ảnh để phóng to')):null;
    let body;

  }));

// điền từ: mỗi ___ trong đoạn văn / bảng / sơ đồ thành một ô nhập (hoặc ô chọn nếu có khung từ)
function gapView(g,N,sub,review,set,okOf){
  const bank=g.bank||[],view=renderHTML(g.html,'gap-text');let k=0;
  const walk=node=>{for(const c of [...node.childNodes]){
    if(c.nodeType!==3){walk(c);continue;}
    const parts=c.textContent.split(/_{3,}/);if(parts.length<2)continue;
    const frag=document.createDocumentFragment();
    parts.forEach((p,i)=>{frag.append(p);const it=i<parts.length-1&&g.items[k++];if(it)frag.append(gapInput(g,it,N.nums[it.id],sub,review,set,okOf));});
    c.replaceWith(frag);
  }};
  walk(view);
  const box=bank.length?h('div',{class:'opt-box'},h('ul',{class:'bank'},bank.map((w,i)=>h('li',{},h('b',{},LETTERS[i]),' ',w)))):null;
  return [box,view];
}
function gapInput(g,it,no,sub,review,set,okOf){

      h('option',{value:''},'—'),g.bank.map((w,i)=>h('option',{value:String(i),selected:hasAns(v)&&String(v)===String(i)},LETTERS[i])));
  }else{
    el=h('input',{class:'gap-in'+cls,type:'text',autocomplete:'off',spellcheck:'false',disabled:review,'aria-label':'Câu '+no,value:v??''});
    const chk=()=>{const over=!!g.maxWords&&el.value.trim().split(/\s+/).filter(Boolean).length>g.maxWords;el.classList.toggle('over',over);el.title=over?`Quá ${g.maxWords} từ`:'';};
    el.addEventListener('input',()=>{set(it.id,el.value);chk();});chk();
  }
  const out=h('span',{class:'gap'},h('b',{class:'gap-no'},no),el);
  if(review&&cls===' bad'&&it.answer!==undefined)out.append(h('span',{class:'ok gap-ans'},'→ '+correctText(g,it)));
  return out;
}

// tô vàng phần chữ đang bôi đen trong bài đọc (tách từng đoạn chữ nên tô được qua nhiều đoạn văn)
function highlightSel(root){
  const sel=getSelection();
  if(!sel.rangeCount||sel.isCollapsed)return false;
  const r=sel.getRangeAt(0);
  if(!root.contains(r.commonAncestorContainer))return false;
  const wk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>r.intersectsNode(n)&&n.textContent.trim()?1:2}),nodes=[];
  while(wk.nextNode())nodes.push(wk.currentNode);
  for(const n of nodes){
    const s0=n===r.startContainer?r.startOffset:0,e0=n===r.endContainer?r.endOffset:n.length;
    if(s0>=e0)continue;
    let t=n;if(e0<t.length)t.splitText(e0);if(s0>0)t=t.splitText(s0);
    if(t.parentNode.nodeName==='MARK')continue;
    const m=document.createElement('mark');t.replaceWith(m);m.append(t);
  }
  sel.removeAllRanges();return nodes.length>0;
}
function exReading(a,sub){

      `PASSAGE ${i+1}`+(secRange(a,i+1)?` · Q${secRange(a,i+1)}`:''))));
    const body=renderHTML(hl[cur]||ps[cur-1]),keep=()=>{hl[cur]=body.innerHTML;};
    const mark=()=>setTimeout(()=>{if(highlightSel(body))keep();},0);
    body.addEventListener('mouseup',mark);body.addEventListener('touchend',mark);

    passage.replaceChildren(h('h2',{class:'pane-h'},a.title),
      h('div',{class:'hl-bar'},h('span',{},'🖍 Bôi đen chữ để tô màu · bấm vào chỗ đã tô để xóa'),h('button',{class:'btn btn-sm btn-ghost',onclick:()=>{delete hl[cur];draw();}},'XÓA HẾT TÔ MÀU')),
      a.instructions?h('p',{class:'instr'},a.instructions):null,body);

function limitedPlayer(a,sub,review){
  const box=h('div',{class:'player'},h('div',{class:'player-h'},px(SP.head,3),h('b',{class:'px'},'AUDIO')));
  if(review){const u=src(a,a.audio);box.append(u?h('audio',{controls:true,src:u,preload:'none','aria-label':'Bài nghe'}):h('p',{class:'hint'},'Không có file nghe.'));return box;}
  if(!a.hasAudio){box.append(h('p',{class:'hint'},'Bài này chưa có file âm thanh.'));return box;}
  const au=new Audio();onCleanup(()=>{au.pause();au.removeAttribute('src');});
  const fill=h('i',{style:{width:'0%'}}),chip=h('span',{class:'chip'}),tm=h('span',{class:'hint'},'00:00'),btn=h('button',{class:'btn btn-blue'});
  let state='idle';
  const used=()=>sub.listens||0;
  const draw=()=>{
    chip.textContent=`LƯỢT NGHE: ${used()}/${MAX_LISTENS}`;btn.disabled=false;
    if(state==='playing')btn.textContent='❚❚ TẠM DỪNG';
    else if(state==='paused')btn.textContent='▶ NGHE TIẾP';
    else if(used()<MAX_LISTENS)btn.textContent=`▶ NGHE LẦN ${used()+1}`;
    else{btn.textContent='ĐÃ HẾT LƯỢT NGHE';btn.disabled=true;}
  };
  au.ontimeupdate=()=>{fill.style.width=(au.duration?au.currentTime/au.duration*100:0)+'%';tm.textContent=fmtT(au.currentTime)+' / '+fmtT(au.duration||0);};
  au.onended=()=>{state='idle';fill.style.width='100%';draw();};
  btn.onclick=async()=>{
    if(state==='playing'){au.pause();state='paused';return draw();}
    if(state==='paused'){au.play();state='playing';return draw();}
    if(!await confirmDlg(`Em bắt đầu nghe lần ${used()+1}/${MAX_LISTENS}. Mỗi lần bấm nghe là mất 1 lượt, kể cả khi tải lại trang. Bắt đầu nhé?`,{yes:'NGHE',no:'CHƯA'}))return;
    btn.disabled=true;
    try{const r=await api('/api/listen/'+a.id,{});sub.listens=r.listens;au.src=r.url;await au.play();state='playing';}
    catch(e){toast(e.message,'bad');}
    draw();
  };
  draw();
  box.append(h('div',{class:'lp'},btn,chip,tm),h('div',{class:'sc-bar'},fill),
    h('p',{class:'hint'},`Mỗi bài được nghe tối đa ${MAX_LISTENS} lần và không tua được, chỉ tạm dừng được.`));
  return box;
}

      try{const up=await uploadBlob(blob,{aid:a.id,qid:q.id});const r=await api(`/api/rec/${a.id}/${q.id}`,{path:up.path,dur:+dur.toFixed(1)});sub.speaking.items[q.id]=r.item;beep(880,.1);}

      done(q);
    }
    try{await recStart(q.id,s=>{m.set(s,false);if(p2&&s>=135)stop();});}catch(e){micError(e);return ready(q);}
    busy=true;drawSteps();m.set(0,false);

  }
  function done(q){
    const it=sub.speaking.items[q.id],i=qs.indexOf(q),m=isP2(q)?meter2():meter();m.set(it.dur,true);
    const nextBtn=i<qs.length-1?h('button',{class:'btn btn-blue',onclick:()=>ask(i+1,{next:true})},'CÂU TIẾP THEO ›')
      :qs.every(has)?h('button',{class:'btn btn-green',onclick:()=>submit()},'NỘP BÀI'):null;
    zone.replaceChildren(h('div',{class:'rec-live ok'},px(SP.check,3),' ĐÃ GHI ÂM XONG'),h('audio',{controls:true,src:recUrl(sub,it),'aria-label':'Nghe lại câu trả lời'}),m.el,
      h('div',{class:'rc-btns'},h('button',{class:'btn btn-ghost',onclick:async()=>{

    drawSteps();
    if(qs.every(has)&&!closed){closed=true;say(CLOSING);} // trả lời xong hết: giám thị kết thúc phần thi
  }
  async function submit(){
    if(Rec.active){toast('Hãy dừng ghi âm trước khi nộp bài nhé!','bad');return;}
    const miss=qs.map((q,i)=>has(q)?null:i+1).filter(Boolean);
    if(miss.length){toast(`Em còn ${miss.length} câu chưa ghi âm: câu ${miss.join(', ')}.`,'bad');return;}
    const off=qs.filter(q=>{const d=sub.speaking.items[q.id].dur;return isP2(q)?d<60:d<15||d>40;}).length;
    if(off&&!await confirmDlg(`Có ${off} câu chưa đạt độ dài khuyến nghị (Part 1, 3: 15–40 giây; Part 2: 1–2 phút). Em vẫn muốn nộp hay làm lại?`,{yes:'NỘP BÀI',no:'LÀM LẠI'}))return;
    stopAll();
    if(!await submitToServer(a,sub,{}))return;fanfare();
    await dialog({title:'ĐÃ NỘP BÀI!',body:h('div',{class:'result'},h('div',{class:'res-score px'},`${qs.length} CÂU`),h('p',{class:'cg-s'},'Cô sẽ nghe từng câu và nhận xét cho em.')),buttons:[{label:'VỀ BẢN ĐỒ',value:true,cls:'btn-green'}],closable:false});
    go('road',{skill:a.skill,month:monthOf(a)});
  }
  // màn bắt đầu: bấm nút để trình duyệt cho phép đọc thành tiếng, đồng thời xin quyền micro (Part 2 tự mở micro)
  tag.textContent=`${qs.length} CÂU · PART ${[...new Set(qs.map(partOf))].join(' · ')}`;
  text.textContent=qs.some(has)?`Chào ${S.name}! Em làm tiếp từ câu ${cur+1} nhé. Bấm TIẾP TỤC khi em sẵn sàng.`
    :`Chào ${S.name}! Cô là giám thị phần thi nói hôm nay. Cô sẽ đọc từng câu hỏi, nghe xong em bấm nút micro để trả lời. Bấm BẮT ĐẦU khi em sẵn sàng nhé.`;
  zone.replaceChildren(h('button',{class:'btn btn-green btn-lg',onclick:async()=>{
    try{Rec.asking=true;const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());}
    catch(e){micError(e);return;}finally{setTimeout(()=>{Rec.asking=false;},500);}
    ask(cur,{resume:qs.some(has)});
  }},qs.some(has)?'▶ TIẾP TỤC':'▶ BẮT ĐẦU PHẦN THI NÓI'),
    h('p',{class:'hint'},Say.ok?'Nhớ bật loa hoặc đeo tai nghe để nghe giám thị đọc câu hỏi.':'Trình duyệt này không đọc thành tiếng được, em đọc câu hỏi trên màn hình nhé.'));
  drawSteps();
  if(!qs.length){zone.replaceChildren(h('p',{class:'empty'},'Bài này chưa có câu hỏi.'));}
  A.body.append(h('div',{class:'one-col'},h('section',{class:'pane'},a.instructions?h('p',{class:'instr'},a.instructions):null,stage,stepsEl,zone,
    h('div',{class:'foot'},h('span',{class:'hint'},'Mỗi câu là một file ghi âm riêng.'),subBtn))));
  return A.root;
}

// cô tải đề (PDF / ảnh) hoặc dán chữ → AI dựng passage, câu hỏi và đáp án

function aiImportBox(skill,onResult){
  let alive=true;onCleanup(()=>{alive=false;});
  const src2=(label,ph)=>({files:h('input',{type:'file',multiple:true,accept:'application/pdf,image/*','aria-label':label}),
    ta:h('textarea',{class:'ta',rows:3,placeholder:ph,'aria-label':label})});
  const T=src2('File đề (PDF hoặc ảnh)','Hoặc dán chữ của đề vào đây'),K=src2('File đáp án (PDF hoặc ảnh)','Hoặc dán đáp án vào đây, ví dụ: 1 TRUE  2 FALSE  3 nine ...');
  const st=h('p',{class:'hint',role:'status'}),btn=h('button',{class:'btn btn-blue btn-lg',onclick:()=>run()},'🤖 AI ĐỌC ĐỀ + ĐÁP ÁN');
  async function run(){
    const tf=[...T.files.files],kf=[...K.files.files];
    if(!tf.length&&!T.ta.value.trim()){toast('Hãy chọn file đề hoặc dán chữ của đề.','bad');return;}
    if([...tf,...kf].some(f=>f.size>30*1048576)){toast('Mỗi file tối đa 30 MB.','bad');return;}
    if(!kf.length&&!K.ta.value.trim()&&!await confirmDlg(skill==='reading'?'Cô chưa thêm đáp án. AI sẽ lấy đáp án trong đề (nếu có) hoặc tự giải, cô cần kiểm tra kỹ hơn. Tiếp tục chứ?':'Cô chưa thêm đáp án. AI không nghe được audio nên chỉ lấy được đáp án nếu trong đề có sẵn. Tiếp tục chứ?',{yes:'TIẾP TỤC',no:'THÊM ĐÁP ÁN'}))return;
    btn.disabled=true;
    try{
      st.textContent='Đang tải đề và đáp án lên...';
      const up=async fs=>{const out=[];for(const f of fs)out.push((await uploadBlob(f)).path);return out;};
      const {job}=await api('/api/ai/parse',{skill,paths:await up(tf),text:T.ta.value,keyPaths:await up(kf),keyText:K.ta.value});
      const t0=Date.now();
      while(alive){
        st.textContent=`AI đang đọc đề và ghép đáp án... ${fmtT((Date.now()-t0)/1000)} (đề đầy đủ 40 câu mất khoảng 1–3 phút, cô cứ để trang mở nhé)`;
        await sleep(4000);
        const j=await api('/api/ai/job/'+job);
        if(j.status==='error')throw new Error(j.error);
        if(j.status==='done'){if(alive)onResult(j.result);return;}
      }
    }catch(e){st.textContent='';alertDlg(e.message,'AI CHƯA ĐỌC ĐƯỢC ĐỀ');}
    finally{btn.disabled=false;}
  }
  const col=(n,title,hint,x)=>h('div',{class:'ai-col'},h('b',{class:'ai-step'},n),h('h4',{class:'ai-h'},title),h('p',{class:'hint'},hint),x.files,x.ta);
  return h('section',{class:'data-box'},h('h3',{class:'pane-h'},'🤖 NHẬP ĐỀ BẰNG AI'),
    h('div',{class:'ai-cols'},
      col('1','ĐỀ BÀI',skill==='reading'?'PDF hoặc ảnh chụp đề Reading (3 passage, 40 câu).':'PDF hoặc ảnh chụp giấy đề Listening. File mp3 cô tải ở mục File âm thanh bên dưới.',T),
      col('2','ĐÁP ÁN',skill==='reading'?'PDF, ảnh hoặc chữ của đáp án. Không có thì AI tự giải.':'PDF, ảnh hoặc chữ của đáp án. Nên có, vì AI không nghe được audio.',K)),
    h('div',{class:'row-btns'},btn),st,
    DB.ai?null:h('p',{class:'form-err'},'Máy chủ chưa có OPENROUTER_API_KEY nên chưa dùng được AI.'));
}
